name: Build GhostSurf VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022  # VS 2022 pre-installe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Clone JUCE
      run: git clone --depth=1 https://github.com/juce-framework/JUCE.git

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build VST3
      run: cmake --build build --config Release

    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhostSurf-VST3-Windows
        path: build/GhostSurf_artefacts/Release/VST3/GhostSurf.vst3
        retention-days: 30
